# Voltix CI — nonprivileged checks only.
#
# Scope decision (verification plan): hosted CI runs unit, static, race,
# simulator and loopback-only integration tests. The Compose demo,
# fault harness and native systemd checks require a daemon/service
# environment and are the documented *local* path (make demo /
# fault-test / native-test). Hosted execution is unverified until a
# remote is authorised and a run is observed.
name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd sim && uv sync && uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: astral-sh/setup-uv@v5
      - run: cd sim && uv sync
      - run: go test -tags=integration -v ./internal/device/ ./internal/control/
