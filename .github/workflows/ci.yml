# Voltix CI — nonprivileged checks only.
#
# Scope decision (verification plan): hosted CI runs unit, static, race,
# simulator and loopback-only integration tests. The Compose demo,
# fault harness and native systemd checks require a daemon/service
# environment and are the documented *local* path (make demo /
# fault-test / native-test). First green hosted run observed
# 2026-10-19 (run 39186883811).
name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd sim && uv sync
      # These tests run real socket servers on threads; shared runners
      # can starve scheduling, so allow two retries for flake-level races.
      - run: cd sim && uv run pytest -q --reruns 2 --reruns-delay 1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: astral-sh/setup-uv@v5
      - run: cd sim && uv sync
      # Real-time margins (watchdog 10 s, lease expiry, slew ramps) can
      # flake on a shared 2-vCPU runner; retry the suite once.
      - run: |
          for i in 1 2; do
            go test -tags=integration -v ./internal/device/ ./internal/control/ && exit 0
            echo "::warning::integration attempt $i failed; retrying"
          done
          exit 1
