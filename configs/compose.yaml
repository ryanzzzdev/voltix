# Voltix controller configuration for the Compose demo (deploy/compose.yaml).
# Devices address the sim service by DNS name on the field network; the
# telemetry URL addresses the mock on the upstream network. State lives on
# the mounted volume. Tokens are demo-only env values, never real secrets.

controller_id: voltix-demo

devices:
  inverter:
    host: sim
    port: 1502
  meter:
    host: sim
    port: 1503

limits:
  soc_min_pct: 5
  soc_max_pct: 95
  site_export_max_kw: 400
  charge_max_kw: 500
  discharge_max_kw: 500
  normal_slew_kw_per_s: 50

timing:
  cycle_period_ms: 1000
  read_deadline_ms: 200
  write_deadline_ms: 100
  max_input_age_s: 2
  max_loop_gap_s: 2.5

telemetry:
  state_dir: /state
  max_status_events: 90000
  max_alarm_events: 10000
  max_payload_bytes: 1024
  handoff_status_slots: 900
  handoff_alarm_slots: 100

upstream:
  dispatch_listen: 0.0.0.0:8080
  telemetry_url: http://mock:8081/api/telemetry
